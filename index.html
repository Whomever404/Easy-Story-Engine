<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy Story Engine (ESE) - 模块化叙事游戏引擎</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body, #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0f121d;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      }
      .loading-box {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
        padding: 20px;
        background: #0f121d;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loading-fallback" class="loading-box">
        <div style="font-size: 48px; margin-bottom: 16px;">⚡</div>
        <h2 style="color: #64b5f6; margin-bottom: 8px;">Easy Story Engine 正在加载...</h2>
        <p style="color: #aaa; max-width: 560px; font-size: 14px; line-height: 1.6; margin-bottom: 20px;">
          若您直接双击了未打包的文件，请双击根目录下的 <b>启动.bat</b>，或在终端运行 <code>npm run dev</code> / <code>npm run build</code>。
        </p>
      </div>
    </div>
    <!-- Dynamic script loader for offline file:// double-click opening -->
    <script>
      (function() {
        var s = document.createElement('script');
        s.src = './dist/bundle.js';
        s.onerror = function() {
          var s2 = document.createElement('script');
          s2.src = './bundle.js';
          document.body.appendChild(s2);
        };
        document.body.appendChild(s);
      })();
    </script>
    <!-- Module script for Vite dev mode (http://localhost:3000) -->
    <script type="module" src="./src/main.ts"></script>
    <script>
      setTimeout(function() {
        var app = document.getElementById('app');
        if (app && app.children.length <= 1) {
          var fb = document.getElementById('loading-fallback');
          if (fb) fb.style.display = 'flex';
        }
      }, 500);
    </script>
  </body>
</html>
